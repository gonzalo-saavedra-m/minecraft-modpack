plugins {
	id 'fabric-loom' version '1.18-SNAPSHOT'
}

version = "${mod_version}+${minecraft_version}"

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	// Solo para compilar contra la API de eventos; en runtime viene en el pack
	modCompileOnly files('libs/Cobblemon-fabric-1.8.1+1.21.1.jar')
	compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
