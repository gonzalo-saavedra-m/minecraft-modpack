# Claves que ops/sync.sh fuerza en server.properties. Las demás quedan como las deja Minecraft.
# online-mode=true con authlib-injector: el server valida a cada jugador contra el servidor de cuentas propio (Drasl),
# y quien tiene Minecraft original entra con su cuenta de Mojang (Drasl la acepta de respaldo). El -javaagent lo pone
# quien arranca el server. enforce-secure-profile=false: con cuentas de Drasl y de Mojang a la vez no hay firma de chat.
view-distance=10
simulation-distance=6
online-mode=true
enforce-secure-profile=false
motd=§b§lCobblebanda§r §7- Cobblemon 1.8.1
# Semilla elegida: todos los biomas de Alex's Caves a menos de ~2200 bloques del spawn (ver RESEARCH)
level-seed=424242
# Sin watchdog: al restaurar una JVM hibernada (mod hibernation) el tick en curso "duró" todo lo que estuvo apagada y
# el watchdog la mata al segundo, así que el server arrancaba en frío justo después de avisar que estaba listo.
max-tick-time=-1
